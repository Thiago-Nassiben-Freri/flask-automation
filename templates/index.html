<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>Cadastro</h2>

        <form>

            <label for="username">
                Nome de usuário:
            </label>

            <input 
                type="text" 
                id="username" 
                name="username" 
                placeholder="Digite seu usuário"
                required
            >

            <label for="password">
                Senha:
            </label>

            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Digite sua senha"
                required
            >

            <button type="button" onclick="cadastrar()">
                Cadastrar
            </button>

        </form>

    </div>
    <script>
        async function cadastrar() {

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            const response = await fetch(
                    "/cadastro", 
                    {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );

            const result = await response.json();

            if(result.success) {
                console.log("Salvo no banco")
            }

            alert(result.message);

            if(result.success){
                document.getElementById("username").value = "";
                document.getElementById("password").value = "";
            }
        }
    </script>
</body>
</html>
